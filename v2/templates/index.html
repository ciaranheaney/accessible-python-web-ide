<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Web IDE</title>
    <link rel="stylesheet" href="../static/styles.css">
    <script src="../static/index.js"></script>
</head>
<body>
    <!--Header element including website title and font-size selector-->
    <header class="main-header">
        <h1>Python Web IDE</h1>
        <div class="font-input">
            <label for="font-input">Font Size</label>
            <input type="range" id="font-input" value="20" min="12" max="48" step="2" oninput="this.nextElementSibling.value = this.value" tabindex="6">
            <output>20</output>
        </div>
    </header>

    <main class="editor">
        <header>
            <h2>Code Editor</h2>
            <button class="run" id="run-btn" tabindex="2">Run Code</button>
            <button class="clear" id="clear-code-btn" tabindex="3">Clear Code</button>
        </header>
        <div id="code-container">
            <div id="line-numbers"></div>
            <!--Remove wrap attribute to wrap text to next line-->
            <textarea id="code" autofocus tabindex="1" wrap="off" data-gramm="false">

# Online Python - IDE, Editor, Compiler, Interpreter
            
def sum(a, b):
    return (a + b)

a = int(input('Enter 1st number: '))
b = int(input('Enter 2nd number: '))

print(f'Sum of {a} and {b} is {sum(a, b)}')
</textarea>
        </div>
    </main>

    <article class="output">
        <header>
            <h2>Output Terminal</h2>
            <button class="clear" id="clear-output-btn" tabindex="5">Clear Output</button>
        </header>
        <textarea id="output-area" tabindex="4" data-enable-grammarly="false"></textarea>
    </article>
    

</body>
</html>
