<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">  
    <script src="../static/script.js"></script>
    <title>Python Web IDE</title>
</head>
<body>
    <header class="header-container">
        <h1 class="title">Python Web IDE</h1>
        <nav id="menu" class="menu">
            <div class="menu-top-btns">
                <button class="close-menu-btn" id="close-menu-btn" onclick="hide_menu()" tabindex="-1">
                    Hide
                    <i class="fas fa-times" style="font-size: 32px;"></i>
                </button>
                <button class="reset-btn" id="reset-btn" onclick="reset_settings()">
                    Reset
                    <i class="fas fa-redo" style="font-size: 32px;"></i>
                </button>
            </div>
            <h2 class="menu-header">Accessibility Settings</h2>

            <div class="font-input-container">
                <div>
                    <label for="font-input" class="font-label">Font Size</label>
                    <input type="range" class="font-input" id="font-input" value="20" min="12" max="48" step="2" oninput="change_font_size(this.value)">
                </div>
                <output class="font-output" id="font-size-output">20</output>
            </div>



        </nav>
        <button class="menu-btn" id="menu-btn" onclick="show_menu()">
            Menu
            <i class="fas fa-bars" style="font-size: 32px"></i>
        </button>
    </header>

    <main class="editor-container">
        <header class="editor-header">
            <h2 class="editor-title">Code Editor</h2>
            <button class="btn run-btn" id="run-btn" onclick="run_code()">
                <i class="fas fa-play"></i>
                Run Code
            </button>
            <button class="btn clear-btn" id="clear-code-btn" onclick="clear_code()">
                <i class="fas fa-eraser"></i>
                Clear Code
            </button>
        </header>
        <div class="code-container" id="code-container">
            <div class="line-numbers" id="line-numbers"></div>
            <textarea class="code-area" id="code-area" wrap="off" data-gramm="false">

# Python Web IDE - Editor, Compiler, Interpreter

def sum(a, b):
    return (a + b)

a = int(input('Enter 1st number: '))
b = int(input('Enter 2nd number: '))

print(f'Sum of {a} and {b} is {sum(a, b)}')
</textarea>
        </div>
    </main>

    <article class="output-container">
        <header class="output-header">
            <h2 class="output-title">Output Terminal</h2>
            <button class="btn clear-btn" id="clear-output-btn" onclick="clear_output()">
                <i class="fas fa-eraser"></i>
                Clear Output
            </button>
        </header>
        <textarea class="output-area" id="output-area"></textarea>
    </article>

</body>
</html>
