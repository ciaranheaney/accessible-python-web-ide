<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Web IDE</title>
    <link rel="stylesheet" href="../static/styles.css">
    <script src="../static/script.js"></script>
</head>
<body>
    <h1 class="title">Python Web IDE</h1>
    <main id="editor-container">
        <div id="line-numbers"></div>
        <textarea id="code-area">

# Online Python - IDE, Editor, Compiler, Interpreter
            
def sum(a, b):
    return (a + b)

a = 11
b = 14

print(f'Sum of {a} and {b} is {sum(a, b)}')
        </textarea>
    </main>
    </div>
    <div class="button-container">
        <button class="run-button" onclick="run_code()">
            <div class="play-symbol">&#9658;</div>
            <div class="button-word">Run</div>
        </button>
        <button class="clear-button" onclick="clear_code()">
            <img src="../static/images/eraser-icon.png" class="erase-icon">
            <div>Clear</div>
        </button>
    </div>  
    <div class="output-container">
        <h2 class="output-header">Output</h2>
        <textarea id="output" readonly></textarea>
    </div>


</body>
</html>
